name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Install Chromium and Linux dependencies
        run: uv run playwright install --with-deps chromium
      - run: uv run seo-optimizer validate
      - run: uv run pytest -q
      - run: uv run ruff check src tests scripts api
      - run: uv run ruff format --check src tests scripts api
      - run: uv run mypy
      - run: uv build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.12'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check && npm run typecheck && npm test && npm run build
        working-directory: frontend
