name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra browser
      - run: uv run seo-optimizer validate
      - run: uv run pytest -q
      - run: uv run ruff check src tests scripts api
      - run: uv run ruff format --check src tests scripts api
      - run: uv run mypy
      - run: uv build
