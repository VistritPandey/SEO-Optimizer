name: checks
on: [push, pull_request]
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check repository history for exposed credentials
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/optimiser-gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/optimiser-gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/optimiser-gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts=--all --redact=100 --no-banner

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Install Chromium and Linux dependencies
        run: uv run playwright install --with-deps chromium
      - name: Audit locked Python dependencies
        run: |
          uv export --locked --all-extras --no-hashes --no-emit-project --output-file /tmp/optimiser-requirements.txt > /dev/null
          uvx --from pip-audit==2.10.1 pip-audit --requirement /tmp/optimiser-requirements.txt --no-deps --disable-pip
      - run: uv run seo-optimizer validate
      - name: Verify catalog and Git/HTTP/Docker repair workflows
        run: uv run python scripts/verify_workflows.py --sandbox --output reports/workflow-validation.json
      - run: bash -n deploy.sh
      - run: uv run ruff check src tests scripts api deploy/combined-entrypoint.py
      - run: uv run ruff format --check src tests scripts api deploy/combined-entrypoint.py
      - run: uv run mypy
      - run: uv build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.12'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=low
        working-directory: frontend
      - run: npm run format:check && npm run typecheck && npm test && npm run build
        working-directory: frontend
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run playwright install --with-deps chromium
      - name: Check served metadata, responsive workflow and accessibility
        env:
          OPT_BACKEND_URL: http://127.0.0.1:8000
          OPT_COMBINED_DEPLOYMENT: '1'
        run: |
          npm run start --prefix frontend -- --hostname 127.0.0.1 --port 3002 > /tmp/optimiser-preview.log 2>&1 &
          optimiser_preview_pid=$!
          trap 'kill "$optimiser_preview_pid" 2>/dev/null || true' EXIT
          for optimiser_attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3002/ > /dev/null; then break; fi
            sleep 1
          done
          uv run python scripts/test_public_site.py
          uv run python scripts/test_public_browser.py
      - name: Check workspace interactions and recovery
        run: uv run python scripts/test_workspace_browser.py

  combined:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Build single-service image with fictional public config
        run: >-
          docker build -f deploy/combined.Dockerfile
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=demo-public-key
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=demo-your-optimiser
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=demo-your-optimiser.firebaseapp.com
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=1:123:web:demo
          --build-arg NEXT_PUBLIC_SITE_URL=https://example.test
          -t your-optimiser:deploy-test .
      - name: Exercise pages, API, Chromium and process recovery
        run: uv run python scripts/test_combined_container.py
