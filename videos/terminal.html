""<!doctype html><html><head><meta charset="utf-8"><title>Optimizer terminal capture</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10241e;color:#e6efdc;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;height:100vh;display:flex;flex-direction:column}.bar{padding:19px 28px;border-bottom:1px solid #32473a;display:flex;justify-content:space-between;font:14px -apple-system,sans-serif;color:#b3c8a6}.dots{letter-spacing:5px;color:#c8df90}pre{padding:22px 28px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px;line-height:1.55;flex:1;overflow:hidden}.footer{padding:13px 28px;font:12px -apple-system,sans-serif;color:#b3c8a6;border-top:1px solid #32473a}</style></head><body><div class="bar"><span><span class="dots">● ● ●</span> &nbsp; optimizer / real terminal</span><span id="status">Waiting</span></div><pre id="output"></pre><div class="footer">ACTUAL PTY OUTPUT · LOCAL TEST BRANCH · NO GITHUB PUSH</div><script>
let prior='';setInterval(async()=>{const v=await(await fetch('/events')).json();if(v.text!==prior){prior=v.text;const lines=v.text.split('\n');document.getElementById('output').textContent=lines.slice(-20).join('\n')}document.getElementById('status').textContent=v.done?'Completed':'Running'},100);
</script></body></html>
